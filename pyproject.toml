[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-hub"
version = "0.1.0"
description = "A local desktop hub for three independent research applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["Flask==3.1.2", "waitress==3.0.2", "python-dotenv==1.2.2", "modelSpell==0.4.0"]

[project.scripts]
rah = "rah.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly authorized requests to OpenRouter"]

[tool.setuptools.packages.find]
include = ["rah*"]

[tool.setuptools.package-data]
rah = ["static/*", "templates/*", "*.json", "*.sql", "install_assets/*", "install_assets/*/*.whl"]
