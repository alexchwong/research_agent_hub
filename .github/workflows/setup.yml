name: Cross-platform setup

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  setup:
    name: Release ZIP setup (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Bootstrap dev venv and run offline pytest
        shell: bash
        env:
          RAH_CI_PYTHON: "cpython@3.12.14"
        run: |
          uv python install --no-bin "$RAH_CI_PYTHON"
          uv venv --managed-python --python "$RAH_CI_PYTHON" .venv
          python=.venv/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then python=.venv/Scripts/python.exe; fi
          uv pip sync --python "$python" --require-hashes --only-binary=:all: dev-deps.lock
          "$python" -m pytest -q -m 'not live'
          node --check rah/static/app.js
          node --check rah/static/workspace.js
          node --check rah/static/native_handoff.js
      - name: Build the release candidate ZIP
        shell: bash
        run: |
          python=.venv/bin/python
          uv=.venv/bin/uv
          if [[ "$RUNNER_OS" == Windows ]]; then
            python=.venv/Scripts/python.exe
            uv=.venv/Scripts/uv.exe
          fi
          "$python" scripts/bundle_hub.py \
            --uv "$uv" \
            --bundle "$RUNNER_TEMP/rah-bootstrap" \
            --release-dir "$RUNNER_TEMP/rah-release-candidates"
      - name: Install the release ZIP and test failure isolation and retained native entry points
        shell: bash
        run: |
          python=.venv/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then python=.venv/Scripts/python.exe; fi
          "$python" tests/smoke_release.py "$RUNNER_TEMP/rah-release-candidates" --shortcut --report reports/setup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rah-setup-report-${{ matrix.runner }}
          path: reports/setup.json
      - uses: actions/upload-artifact@v4
        with:
          name: rah-release-candidate-${{ matrix.runner }}
          path: ${{ runner.temp }}/rah-release-candidates
