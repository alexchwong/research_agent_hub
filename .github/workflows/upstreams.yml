name: Pinned upstream setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rah/**'
      - 'tests/**'
      - 'scripts/bundle_hub.py'
      - 'pyproject.toml'
      - 'hub-deps.lock'
      - 'dev-deps.lock'
      - '.github/workflows/upstreams.yml'
  push:
    paths:
      - 'rah/**'
      - 'tests/**'
      - 'scripts/bundle_hub.py'
      - 'pyproject.toml'
      - 'hub-deps.lock'
      - 'dev-deps.lock'
      - '.github/workflows/upstreams.yml'

permissions:
  contents: read

jobs:
  native-install:
    name: Three packaged app pins on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Confirm the intended runner architecture
        shell: bash
        env:
          RAH_EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch=$(printf "%s" "$RUNNER_ARCH" | tr "[:upper:]" "[:lower:]")
          test "$actual_arch" = "$RAH_EXPECTED_ARCH"
      - name: Build and bootstrap a fresh installed wheel
        shell: bash
        run: |
          python -m venv .venv
          bin=.venv/bin
          uv=$bin/uv
          if [[ "$RUNNER_OS" == Windows ]]; then bin=.venv/Scripts; uv=$bin/uv.exe; fi
          "$bin/python" -m pip install --only-binary=:all: uv==0.13.9
          "$uv" pip sync --python "$bin/python" --require-hashes --only-binary=:all: dev-deps.lock
          "$bin/python" scripts/bundle_hub.py --system-python --uv "$uv" \
            --bundle "$RUNNER_TEMP/rah-bootstrap" --venv "$RUNNER_TEMP/rah-installed"
      - name: Test core setup and both native browsers from the installed wheel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            rah_python="$RUNNER_TEMP/rah-installed/Scripts/python.exe"
            uv=.venv/Scripts/uv.exe
          else
            rah_python="$RUNNER_TEMP/rah-installed/bin/python"
            uv=.venv/bin/uv
          fi
          "$rah_python" tests/smoke_setup.py --uv "$uv" --packaged --shortcut --report reports/upstreams.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rah-upstreams-report-${{ matrix.runner }}
          path: reports/upstreams.json
