name: Pinned upstream setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rah/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'hub-deps.lock'
      - 'dev-deps.lock'
      - '.github/workflows/upstreams.yml'
  push:
    paths:
      - 'rah/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'hub-deps.lock'
      - 'dev-deps.lock'
      - '.github/workflows/upstreams.yml'

permissions:
  contents: read

jobs:
  native-install:
    name: Three packaged app pins on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the intended runner architecture
        shell: bash
        env:
          RAH_EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch=$(printf "%s" "$RUNNER_ARCH" | tr "[:upper:]" "[:lower:]")
          test "$actual_arch" = "$RAH_EXPECTED_ARCH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Build the release candidate ZIP
        shell: bash
        env:
          RAH_CI_PYTHON: "cpython@3.12.14"
        run: |
          uv python install --no-bin "$RAH_CI_PYTHON"
          uv venv --managed-python --python "$RAH_CI_PYTHON" .venv
          python=.venv/bin/python
          uv=.venv/bin/uv
          if [[ "$RUNNER_OS" == Windows ]]; then
            python=.venv/Scripts/python.exe
            uv=.venv/Scripts/uv.exe
          fi
          uv pip sync --python "$python" --require-hashes --only-binary=:all: dev-deps.lock
          "$python" scripts/bundle_hub.py --uv "$uv" \
            --bundle "$RUNNER_TEMP/rah-bootstrap" --release-dir "$RUNNER_TEMP/rah-release-candidates"
      - name: Install the release ZIP and test core setup and both native browsers
        shell: bash
        run: |
          python=.venv/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then python=.venv/Scripts/python.exe; fi
          "$python" tests/smoke_release.py "$RUNNER_TEMP/rah-release-candidates" --packaged --shortcut --report reports/upstreams.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rah-upstreams-report-${{ matrix.runner }}
          path: reports/upstreams.json
